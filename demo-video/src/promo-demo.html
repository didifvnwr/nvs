async function render(t){

    if(i===SEG.length-1)o=Math.min(clamp((t-a)/.5),clamp((TOTAL-t)/1.2));
    $(id).style.opacity=o;
  });
  $('grid').style.backgroundPosition=`${t*8}px ${t*14}px`;

  $('prog').style.width=(t/TOTAL*100)+'%';
  $('nvs').style.opacity=clamp((8-t)/.6)*clamp((t-.4)/.4);
  const L=i=>clamp(t-SEG[i][0],0,SEG[i][1]-SEG[i][0]);
  let lt;

  [...$('sigb').children].forEach((r,i)=>r.style.opacity=lt>2+i*.35?1:.18);
  $('a2map').style.opacity=seg(lt,5.2,.6);
  [...$('a2lines').children].forEach((p,i)=>{const s=seg(lt,5.6+i*.4,.6);p.style.strokeDashoffset=(1-s)*300;p.style.opacity=s});
  [8.7,9.4,10.1,7.9].forEach((d,i)=>{$('a2n'+i).style.opacity=seg(lt,d,.5)})
  lt=L(2);jobs.push(setImg($('a3v'),pp('robot',lt*24,289)));
  show('a3k',lt,.1);show('a3h',lt,.3);show('a3c1',lt,2.3,.55,18);show('a3c2',lt,4.4,.55,18);animWave('a3w',lt,lt>4.6,20);show('a3p',lt,11.25);
  lt=L(3);jobs.push(setImg($('a4v'),pp('chatbot',lt*24,293)));

  const shown=[...$('a4d').children].filter(e=>e.style.opacity==1).length;$('a4n').textContent=String(shown).padStart(2,'0');
  show('a4a',lt,3.8);show('a4s',lt,5.0);show('a4w',lt,6.4);
  show('a4p',lt,8.5);show('a4b',lt,8.9);
  lt=L(4);show('a5h',lt,.2);

  $('a5d').style.boxShadow=lt<2.8?'0 0 40px rgba(224,184,119,.5)':'none';$('a5n').style.boxShadow=lt>=2.8?'0 0 40px rgba(61,225,255,.5)':'none';
  show('a5m',lt,3.45);animWave('a5w',lt,lt>3.6&&lt<5.6,28);
  lt=L(5);jobs.push(setImg($('a6v'),pp('phone',lt*24,192)));
  show('a6h',lt,.2);show('a6r',lt,.7);animWave('a6w',lt,true,40);$('a6dot').style.opacity=.4+.6*Math.abs(Math.sin(lt*4));
  show('a6t',lt,4.8);show('a6l1',lt,5.2,.4,8);show('a6l2',lt,6.4,.4,8);show('a6l3',lt,7.3,.4,8);
  lt=L(6);jobs.push(setImg($('a7v'),pp('chatbot',lt*24+90,293)));
  show('a7h',lt,.2);show('a7c',lt,.7);show('a7r1',lt,5.6,.4,8);show('a7r2',lt,6.6,.4,8);show('a7r3',lt,7.6,.4,8);
  show('a7x',lt,9.3);

  show('a12l',lt,.2,.7,0);show('a12h',lt,1.0);show('a12c',lt,2.0);
  await Promise.all(jobs);
}

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Heebo;font-weight:400;src:url(heebo-hebrew-400-normal.woff2)}
@font-face{font-family:Heebo;font-weight:800;src:url(heebo-hebrew-800-normal.woff2)}
html,body{margin:0;background:#0a0c0f}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;font-family:Heebo,sans-serif}
svg{position:absolute;left:0;top:0}
#cap{position:absolute;left:50px;right:50px;top:1070px;text-align:center;direction:rtl;
  color:#fff;font-weight:800;font-size:54px;line-height:1.25;
  text-shadow:0 2px 14px rgba(0,0,0,.65),0 0 3px rgba(0,0,0,.5);text-wrap:balance}
#tag{position:absolute;left:0;right:0;top:96px;text-align:center;direction:rtl;color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.6)}
#tag .n{font-weight:400;font-size:28px;letter-spacing:6px;opacity:.85}
#tag .t{font-weight:800;font-size:64px;margin-top:6px}
</style>
</head>
<body>
<div id="stage">
<svg id="svg" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d838a"/><stop offset="1" stop-color="#9ba1a7"/></linearGradient>
    <linearGradient id="floor1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62666b"/><stop offset="1" stop-color="#43464a"/></linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f0f7" stop-opacity=".30"/><stop offset="1" stop-color="#e8f0f7" stop-opacity=".04"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfe3f5" stop-opacity=".55"/><stop offset=".5" stop-color="#f1faff" stop-opacity=".9"/><stop offset="1" stop-color="#bfe3f5" stop-opacity=".55"/></linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cdd6dc"/><stop offset="1" stop-color="#9eabb4"/></linearGradient>
    <radialGradient id="blue" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6db4ff" stop-opacity=".95"/><stop offset=".55" stop-color="#3f86e8" stop-opacity=".45"/><stop offset="1" stop-color="#3f86e8" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <filter id="fblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="fb" stdDeviation="0"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence id="gt" type="fractalNoise" baseFrequency=".85" numOctaves="1" seed="1"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="mclip"><rect x="97" y="207" width="526" height="716" rx="20"/></clipPath>
  </defs>
  <g id="scene"></g>
  <rect width="720" height="1280" fill="url(#vig)"/>
  <rect id="grainr" width="720" height="1280" filter="url(#grain)" opacity=".11" style="mix-blend-mode:overlay"/>
  <rect id="dip" width="720" height="1280" fill="#0a0c0f" opacity="0"/>
</svg>
<div id="tag"></div>
<div id="cap"></div>
</div>
<script>
const DUR = 18, S2 = 7;           // total duration, scene-2 start (seconds)
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const sm=p=>p*p*(3-2*p);
const prog=(t,a,b)=>clamp((t-a)/(b-a));
// "robotic" progress: holds, then jerks to the next of n steps
const rob=(p,n)=>{ if(p<=0)return 0; if(p>=1)return 1; const k=p*n,i=Math.floor(k),f=k-i; return (i+sm(clamp((f-.55)/.45)))/n; };
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s);};
const rad=d=>d*Math.PI/180;
const dir=d=>[Math.cos(rad(d)),Math.sin(rad(d))];
const f1=n=>n.toFixed(1);
const ln=(a,b,w,c,o=1)=>`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${o}"/>`;
const add=(p,d,L)=>[p[0]+d[0]*L,p[1]+d[1]*L];

/* ---------------- scene 1: bedroom, wide ---------------- */
function pose(t){
  const sit=rob(prog(t,1.0,2.4),6), stand=rob(prog(t,3.0,4.4),6);
  const a=-50+50*sit+90*stand, b=60+30*sit;
  let hip,knee; const da=dir(a);
  if(stand>0){ knee=[400,796]; hip=[400-70*da[0],796-70*da[1]]; }
  else { hip=[330,796]; knee=add([330,796],da,70); }
  const ankle=add(knee,dir(b),100);
  const phi=180+90*sit+(stand>0?22*Math.sin(Math.PI*stand):0);
  const tor=dir(phi);
  const sh=add(hip,tor,94), head=add(hip,tor,138);
  const ua=5+75*sit+15*stand, fa=ua+6+10*stand;
  const el=add(sh,dir(ua),60), hand=add(el,dir(fa),56);
  const toe=add(ankle,dir(b-90),30);
  return {hip,knee,ankle,toe,sh,head,el,hand,tor,sit,stand};
}
function fig(p,op=1,c='#25272b',c2='#17191c'){
  const off=(q,dx,dy)=>[q[0]+dx,q[1]+dy];
  const fk=off(p.knee,-10,-3), fa=off(p.ankle,-10,-2), ft=off(p.toe,-10,-2), fh=off(p.hip,-4,0);
  const neck=add(p.hip,p.tor,112), top=add(p.hip,p.tor,100);
  return `<g opacity="${op}">
    ${ln(fh,fk,30,c2)}${ln(fk,fa,24,c2)}${ln(fa,ft,14,c2)}
    ${ln(p.hip,top,52,c)}${ln(top,neck,22,c)}
    <circle cx="${f1(p.head[0])}" cy="${f1(p.head[1])}" r="25" fill="${c}"/>
    ${ln(p.hip,p.knee,30,c)}${ln(p.knee,p.ankle,24,c)}${ln(p.ankle,p.toe,14,c)}
    ${ln(p.sh,p.el,17,c)}${ln(p.el,p.hand,15,c)}
    <circle cx="${f1(p.hand[0])}" cy="${f1(p.hand[1])}" r="9" fill="${c}"/>
  </g>`;
}
function s1(t){
  const p=pose(t);
  const bp=prog(t,1.0,2.0);
  let o='';
  // wall + window + clock
  o+=`<rect width="720" height="870" fill="url(#wall1)"/>`;
  o+=`<rect x="490" y="230" width="190" height="290" rx="6" fill="#d7e1ea"/><rect x="490" y="230" width="190" height="290" rx="6" fill="none" stroke="#4a4e53" stroke-width="12"/>`;
  o+=`<line x1="585" y1="230" x2="585" y2="520" stroke="#4a4e53" stroke-width="8"/><line x1="490" y1="375" x2="680" y2="375" stroke="#4a4e53" stroke-width="8"/>`;
  const sec=Math.floor(t);
  o+=`<circle cx="190" cy="300" r="52" fill="#d2d6da" stroke="#3f4347" stroke-width="7"/>`+
     ln([190,300],add([190,300],dir(-60),28),6,'#2c2f33')+ln([190,300],add([190,300],dir(20),38),4,'#2c2f33')+
     ln([190,300],add([190,300],dir(sec*6-90),42),2,'#b04a45');
  // floor
  o+=`<rect y="860" width="720" height="420" fill="url(#floor1)"/>`;
  for(let i=0;i<6;i++){const y=900+i*i*14+i*26; o+=`<line x1="0" y1="${y}" x2="720" y2="${y}" stroke="#2f3236" stroke-width="2" opacity=".5"/>`;}
  o+=`<polygon points="500,230 680,230 760,1280 330,1280" fill="url(#shaft)"/>`;
  // worn spot (permanent rings) + landing ripple
  o+=`<ellipse cx="408" cy="910" rx="78" ry="16" fill="#2c2f33" opacity=".42"/><ellipse cx="408" cy="910" rx="56" ry="11" fill="#2c2f33" opacity=".5"/><ellipse cx="408" cy="910" rx="34" ry="7" fill="#26292c" opacity=".6"/>`;
  const rp=prog(t,2.35,3.3);
  if(rp>0&&rp<1) o+=`<ellipse cx="408" cy="910" rx="${f1(40+90*rp)}" ry="${f1(8+17*rp)}" fill="none" stroke="#e3e8ec" stroke-width="3" opacity="${f1(.7*(1-rp))}"/>`;
  // bed
  o+=`<rect x="36" y="690" width="26" height="215" rx="6" fill="#4b4f54"/>`;
  o+=`<rect x="55" y="852" width="375" height="20" rx="4" fill="#44484c"/><rect x="62" y="870" width="16" height="36" fill="#3c4045"/><rect x="408" y="870" width="16" height="36" fill="#3c4045"/>`;
  o+=`<rect x="55" y="820" width="375" height="36" rx="10" fill="#6c7279"/>`;
  o+=`<ellipse cx="185" cy="806" rx="58" ry="19" fill="#aeb4ba"/>`;
  // ghosts of other mornings, then the figure
  const gh=prog(t,4.5,5.3);
  if(gh>0) for(let k=0;k<3;k++){const tl=((t-4.5)*1.1+k*1.5)%4.6; o+=fig(pose(tl),.16*gh,'#dfe5ea','#dfe5ea');}
  o+=fig(p);
  // blanket
  if(bp<1){const e=sm(bp),dx=70*e,dy=60*e;
    o+=`<path transform="translate(${f1(dx)} ${f1(dy)})" opacity="${f1(1-e)}" d="M250 822 C252 782 290 772 322 768 C350 752 380 728 412 738 C440 748 452 790 452 822 Z" fill="#848b92"/>`;}
  return o;
}

/* ---------------- scene 2: bathroom, close-ups ---------------- */
function noise(t){ return hash(Math.floor(t*24)); }
function face(t,tilt,gaze){
  const blink=Math.max(0,1-Math.abs(t-6.9)/.09, 1-Math.abs(t-4.7)/.09);
  const ry=10*(1-.92*blink);
  const g=gaze;
  let o=`<g transform="rotate(${f1(tilt)} 360 760) translate(0 ${f1(tilt*2.2)})">`;
  o+=`<path d="M135 930 C150 800 250 762 360 762 C470 762 570 800 585 930 Z" fill="#56636c"/>`;
  o+=`<rect x="318" y="640" width="84" height="140" rx="30" fill="#a98a7b"/>`;
  o+=`<ellipse cx="248" cy="530" rx="16" ry="30" fill="#b59585"/><ellipse cx="472" cy="530" rx="16" ry="30" fill="#b59585"/>`;
  o+=`<ellipse cx="360" cy="520" rx="114" ry="146" fill="#c2a090"/>`;
  o+=`<path d="M244 505 C238 358 300 354 360 356 C420 354 482 358 476 505 C440 440 280 440 244 505 Z" fill="#3a3434"/>`;
  o+=ln([292,498],[340,494],7,'#3a3434')+ln([380,494],[428,498],7,'#3a3434');
  for(const x of [318,402]){
    o+=`<ellipse cx="${x}" cy="526" rx="17" ry="${f1(ry)}" fill="#eef0f1"/>`;
    if(blink<.8) o+=`<circle cx="${f1(x+g[0])}" cy="${f1(526+g[1])}" r="${f1(6.5*(1-.5*blink))}" fill="#2b2523"/>`;
  }
  o+=`<path d="M360 534 C353 560 349 572 362 574" fill="none" stroke="#a07f6f" stroke-width="5" stroke-linecap="round"/>`;
  const brushing=t>3.9&&t<5.6;
  o+= brushing ? `<ellipse cx="360" cy="606" rx="28" ry="9" fill="#7c4c4a"/>` :
       `<path d="M334 602 Q360 612 386 602" fill="none" stroke="#8a5f58" stroke-width="6" stroke-linecap="round"/>`;
  o+=`</g>`;
  return o;
}
function s2(t){
  let o='';
  o+=`<rect width="720" height="1280" fill="#7b868d"/>`;
  for(let x=0;x<=720;x+=90) o+=`<line x1="${x}" y1="0" x2="${x}" y2="1280" stroke="#000" stroke-opacity=".07" stroke-width="3"/>`;
  for(let y=0;y<=1280;y+=90) o+=`<line x1="0" y1="${y}" x2="720" y2="${y}" stroke="#000" stroke-opacity=".07" stroke-width="3"/>`;

  if(t<3.3){ // --- faucet + water
    const lever=-50*rob(prog(t,.2,.9),4);
    o+=`<rect x="0" y="930" width="720" height="350" fill="#c5cbd0"/><ellipse cx="360" cy="1010" rx="300" ry="70" fill="#9aa3a9"/><ellipse cx="360" cy="1010" rx="260" ry="52" fill="#7f898f"/>`;
    o+=`<rect x="318" y="190" width="84" height="70" rx="14" fill="#d9dee2"/>`;
    o+=`<g transform="rotate(${f1(lever)} 392 205)"><rect x="380" y="190" width="100" height="22" rx="11" fill="#e8ecef"/></g>`;
    o+=`<rect x="340" y="252" width="40" height="150" rx="18" fill="#cfd5da"/><rect x="334" y="380" width="52" height="26" rx="10" fill="#bcc3c8"/>`;
    const wl=prog(t,.9,1.2), yb=lerp(406,985,wl);
    if(wl>0){
      o+=`<rect x="349" y="406" width="22" height="${f1(yb-406)}" fill="url(#water)"/>`;
      for(let i=0;i<4;i++) o+=`<line x1="${350+i*7}" y1="406" x2="${350+i*7}" y2="${f1(yb)}" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="26 22" stroke-dashoffset="${f1(-t*420-i*13)}"/>`;
      for(let i=0;i<14;i++){const ph=((t*3+hash(i))%1),sx=(hash(i+9)-.5)*2;
        o+=`<circle cx="${f1(360+sx*(30+110*ph))}" cy="${f1(985-90*Math.sin(Math.PI*ph))}" r="${f1(5-3*ph)}" fill="#e9f6ff" opacity="${f1(.8*(1-ph))}"/>`;}
      o+=`<ellipse cx="360" cy="990" rx="${f1(52+12*Math.sin(t*20))}" ry="10" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>`;
    }
    // cupped hands rise into the stream, then lift
    const hin=sm(prog(t,1.5,2.1)), hup=sm(prog(t,2.3,3.2));
    const hy=lerp(1330,880,hin)-hup*520;
    for(const s of [-1,1]) o+=`<g transform="translate(${360+s*66} ${f1(hy)}) rotate(${s*18})"><ellipse rx="74" ry="44" fill="#b79584"/><ellipse cy="-12" rx="52" ry="26" fill="#9c7a6b"/></g>`;
    // splash burst at the face
    const bp=prog(t,2.6,3.3);
    if(bp>0) for(let i=0;i<34;i++){const a=hash(i)*Math.PI*2,v=260+hash(i+3)*520,r=2+hash(i+5)*7;
      o+=`<circle cx="${f1(360+Math.cos(a)*v*bp)}" cy="${f1(640+Math.sin(a)*v*bp+420*bp*bp)}" r="${f1(r)}" fill="#e6f5ff" opacity="${f1(.9*(1-bp))}"/>`;}
    const wash=Math.sin(Math.PI*prog(t,2.7,3.5));
    o+=`<rect width="720" height="1280" fill="#dff1fb" opacity="${f1(.9*wash)}"/>`;
  } else {  // --- mirror
    const blur=14*(1-sm(prog(t,3.3,6.4)));
    document.getElementById('fb').setAttribute('stdDeviation',blur.toFixed(2));
    const look=prog(t,7.4,8.1);
    const gz=[ lerp(lerp(-6,0,sm(prog(t,5.6,6.6))),0,look), lerp(lerp(5,0,sm(prog(t,5.6,6.6))),9,look) ];
    const tilt=7*sm(look);
    o+=`<rect x="90" y="200" width="540" height="730" rx="28" fill="url(#mirror)"/>`;
    o+=`<g clip-path="url(#mclip)"><rect x="97" y="207" width="526" height="716" fill="#a7b3bb"/><g filter="url(#fblur)">${face(t,tilt,gz)}</g>`;
    // water drops
    const dv=prog(t,3.3,3.7)*(1-prog(t,5.2,6.3));
    if(dv>0) for(let i=0;i<10;i++){const x=290+hash(i)*140,y=400+((hash(i+4)*160+(t-3.3)*(18+hash(i+8)*26))%200);
      o+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(3+hash(i+2)*2)}" fill="#e6f4ff" opacity="${f1(.75*dv)}"/><circle cx="${f1(x-1)}" cy="${f1(y-1)}" r="1.3" fill="#fff" opacity="${f1(dv)}"/>`;}
    // toothbrush
    if(t>3.9&&t<5.6){const ox=Math.sin(t*30)*8,e=Math.min(prog(t,3.9,4.2),1-prog(t,5.3,5.6));
      o+=`<g opacity="${f1(e)}">${ln([372+ox,606],[560,560],13,'#3f9bd6')}<rect x="${f1(342+ox)}" y="598" width="34" height="16" rx="5" fill="#f5f7f8"/>`+
        [0,1,2,3].map(i=>`<circle cx="${f1(345+i*13+ox*.5)}" cy="${f1(618+Math.sin(t*9+i))}" r="${f1(5+prog(t,4.1,5.4)*4)}" fill="#fff"/>`).join('')+`</g>`;}
    o+=`</g>`;
    o+=`<rect x="90" y="200" width="540" height="730" rx="28" fill="none" stroke="#454c52" stroke-width="16"/>`;
    o+=`<rect x="97" y="207" width="526" height="716" rx="20" fill="#fff" opacity=".05"/>`;
    o+=`<rect x="0" y="930" width="720" height="350" fill="#c5cbd0"/>`;

    // phone beat
    if(t>7.2){
      const e=sm(prog(t,7.2,8.1)), yph=lerp(1400,800,e);
      const fl=clamp(.55+.35*Math.sin(t*47)*Math.sin(t*13.1)+.3*(noise(t)-.5),.15,1);
      o+=`<rect width="720" height="1280" fill="#0a1017" opacity="${f1(.38*e)}"/>`;
      o+=`<g clip-path="url(#mclip)" style="mix-blend-mode:screen"><ellipse cx="360" cy="830" rx="360" ry="300" fill="url(#blue)" opacity="${f1(fl*e)}"/></g>`;
      o+=`<ellipse cx="360" cy="${f1(yph-30)}" rx="300" ry="170" fill="url(#blue)" opacity="${f1(fl*.55*e)}"/>`;
      o+=`<rect x="248" y="${f1(yph)}" width="224" height="400" rx="36" fill="none" stroke="#7bbcff" stroke-width="5" opacity="${f1(fl)}" filter="url(#glow)"/>`;
      o+=`<rect x="250" y="${f1(yph)}" width="220" height="400" rx="34" fill="#16181b"/>`;
      o+=`<rect x="268" y="${f1(yph+18)}" width="72" height="72" rx="20" fill="#232629"/><circle cx="291" cy="${f1(yph+41)}" r="12" fill="#0c0d0f"/><circle cx="318" cy="${f1(yph+68)}" r="12" fill="#0c0d0f"/>`;
      const skin='#b79180';
      for(let i=0;i<4;i++) o+=ln([262,yph+120+i*52],[322,yph+138+i*52],38,skin);
      o+=ln([466,yph+190],[420,yph+262],40,skin);
      // notifications
      for(let i=0;i<9;i++){const s=7.9+i*.42-i*i*.022,age=t-s;
        if(age>0&&age<1.5){const q=age/1.5,x=360+(hash(i+20)>.5?1:-1)*(150+hash(i+30)*40),y=yph-20-120*sm(q);
          o+=`<g opacity="${f1(Math.sin(Math.PI*q))}"><rect x="${f1(x-92)}" y="${f1(y-22)}" width="184" height="44" rx="22" fill="#f1f6fb"/><circle cx="${f1(x+64)}" cy="${f1(y)}" r="11" fill="#3f86e8"/><rect x="${f1(x-70)}" y="${f1(y-9)}" width="90" height="7" rx="3.5" fill="#9aa5b0"/><rect x="${f1(x-70)}" y="${f1(y+4)}" width="56" height="6" rx="3" fill="#c3cbd3"/></g>`;}}
      const cnt=Math.floor(47*Math.pow(prog(t,7.9,10.7),1.4));
      if(cnt>0) o+=`<circle cx="478" cy="${f1(yph+6)}" r="30" fill="#e0524f"/><text x="478" y="${f1(yph+17)}" text-anchor="middle" font-family="Heebo" font-weight="800" font-size="32" fill="#fff">${cnt}</text>`;
    }
  }
  return o;
}

/* ---------------- captions, tag, global ---------------- */
const CAPS=[
  [1.0,3.7,'מכירים את זה שאתם קמים בבוקר?'],
  [3.9,5.9,'בכל יום באותו צד.'],
  [7.4,9.9,'שוטפים פנים בדיוק באותו אופן,'],
  [10.0,12.7,'מצחצחים שיניים, מסתכלים במראה'],
  [12.8,14.4,'ונזכרים מי אתם.'],
  [14.7,17.6,'ובודקים הודעות, כמה שיותר מהר.']
];
function render(t){
  document.getElementById('scene').innerHTML = t<S2 ? `<g transform="translate(360 800) scale(${(1+.06*prog(t,0,S2)).toFixed(4)}) translate(-360 -800)">${s1(t)}</g>` : s2(t-S2);
  document.getElementById('gt').setAttribute('seed',1+Math.floor(t*12));
  // captions
  let cap='',ca=0;
  for(const [a,b,tx] of CAPS) if(t>=a&&t<=b){cap=tx;ca=Math.min(prog(t,a,a+.25),1-prog(t,b-.2,b));}
  const c=document.getElementById('cap'); c.textContent=cap; c.style.top=(t<S2?1070:64)+'px'; c.style.fontSize=(t<S2?54:48)+'px'; c.style.opacity=ca.toFixed(3); c.style.transform=`translateY(${((1-ca)*14).toFixed(1)}px)`;
  // chapter tag
  const tg=document.getElementById('tag'); const ta=Math.min(prog(t,.35,.9),1-prog(t,2.6,3.2));
  tg.innerHTML=`<div class="n">פרק 1</div><div class="t">הלולאה השקופה</div>`; tg.style.opacity=(t<3.3?ta:0).toFixed(3);
  // dip to dark: open, scene change, close
  const dip=Math.max(1-prog(t,0,.5), 1-clamp(Math.abs(t-S2)/.38), prog(t,DUR-.5,DUR));
  document.getElementById('dip').setAttribute('opacity',dip.toFixed(3));
}
window.DUR=DUR; window.render=render;
</script>
</body>
</html>

/* ---------- people ---------- */
function person({skin,shirt,pants,hair,long}){

  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.26,8,16),M(shirt));body.position.y=.27;body.castShadow=true;torso.add(body);

  const hd=new THREE.Mesh(new THREE.SphereGeometry(.15,24,18),M(skin));hd.castShadow=true;head.add(hd);
  const cap=new THREE.Mesh(new THREE.SphereGeometry(.158,24,14,0,Math.PI*2,0,long?1.9:1.55),M(hair));cap.rotation.x=-.25;cap.castShadow=true;head.add(cap);
  if(long){const back=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),M(hair));back.scale.set(1,1.5,.8);back.position.set(0,-.12,-.07);head.add(back);}
  const eyes=[-1,1].map(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.027,12,10),M('#20242a',.4));e.position.set(s*.055,.02,.14);head.add(e);return e;});
  const smile=new THREE.Mesh(new THREE.TorusGeometry(.04,.008,6,14,Math.PI),M('#7a3d3d'));smile.rotation.z=Math.PI;smile.position.set(0,-.05,.145);smile.scale.set(1,.01,1);head.add(smile);
  const arms=[-1,1].map(s=>{const sh=new THREE.Group();sh.position.set(s*.2,.5,0);torso.add(sh);
    const up=new THREE.Mesh(new THREE.CapsuleGeometry(.05,.2,6,10),M(shirt));up.position.y=-.16;up.castShadow=true;sh.add(up);
    const el=new THREE.Group();el.position.y=-.31;sh.add(el);
    const lo=new THREE.Mesh(new THREE.CapsuleGeometry(.045,.2,6,10),M(skin));lo.position.y=-.15;lo.castShadow=true;el.add(lo);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.05,10,8),M(skin));hand.position.y=-.3;el.add(hand);return {sh,el};});
  const legs=[-1,1].map(s=>{const hp=new THREE.Group();hp.position.set(s*.09,0,0);root.add(hp);
    const th=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.24,6,10),M(pants));th.position.y=-.19;th.castShadow=true;hp.add(th);
    const kn=new THREE.Group();kn.position.y=-.38;hp.add(kn);
    const sn=new THREE.Mesh(new THREE.CapsuleGeometry(.065,.26,6,10),M(pants));sn.position.y=-.2;sn.castShadow=true;kn.add(sn);

}

function pose(p,o){
  p.yaw.rotation.y=o.yaw||0;p.yaw.position.set(o.x,o.y,o.z);
  p.torso.rotation.x=o.torso||0;p.head.rotation.x=o.headX||0;p.head.rotation.z=o.headZ||0;
  const e=o.eyes===undefined?1:o.eyes;p.eyes.forEach(m=>m.scale.set(1,Math.max(.12,e),1));

  for(let i=0;i<2;i++){p.legs[i].hp.rotation.x=(o.thigh??-Math.PI/2)+(i?(o.thighD||0):-(o.thighD||0));p.legs[i].kn.rotation.x=(o.knee||0)+(i?(o.kneeD||0):0)+(!i?(o.kneeD2||0):0);

}

/* ---------- him over time ---------- */
const L1=.38, KNEE_Y=.49, KX=-1.62, HZ0=-.48;
function himPose(t){
  const o={x:-.7,y:.5,z:HZ0,yaw:0,torso:-Math.PI/2,thigh:-Math.PI/2,knee:0,eyes:.15,arm:0,smile:.01};
  const breath=Math.sin(t*1.6)*.012;o.y+=breath;
  const alarm=prog(t,8.4,9.0);
  if(t>=8.4&&t<9.0){o.torso+= .06*Math.sin((t-8.4)*40);}                 // startled twitch
  const sit=rob(prog(t,9.0,9.9),5);o.torso=lerp(-Math.PI/2,0,sit)+(t<9.0?o.torso+Math.PI/2:0);
  if(t>=9.0)o.eyes=lerp(.15,1,prog(t,9.0,9.3));
  const sw=rob(prog(t,9.9,10.9),4);
  o.yaw=lerp(0,-Math.PI/2,sw);o.x=lerp(-.7,KX+L1,sw);
  o.knee=lerp(0,Math.PI/2,rob(prog(t,10.3,11.0),3));
  const st=rob(prog(t,11.4,12.6),4),ph=(1-st)*Math.PI/2;
  if(t>=11.4){o.thigh=-ph;o.knee=ph;o.x=KX+L1*Math.sin(ph);o.y=KNEE_Y+L1*Math.cos(ph);o.torso=.28*Math.sin(Math.PI*st);}
  const stretch=sm(prog(t,12.6,13.1))*(1-sm(prog(t,13.3,13.7)));
  o.arm=-Math.PI*.92*stretch;o.armOut=.25*stretch;o.headX=-.3*stretch;
  o.smile=lerp(.01,1.0,sm(prog(t,12.9,13.5)));
  if(t>=13.5){
    const w=(t-13.5)*8.5,k=prog(t,13.5,15);
    o.x=lerp(KX,-2.75,sm(clamp(k*1.05)));o.thigh=0;o.thighD=Math.sin(w)*.5*Math.min(1,k*5);
    o.knee=0;o.kneeD=Math.max(0,Math.sin(w+Math.PI/2))*.7*Math.min(1,k*5);o.kneeD2=Math.max(0,Math.sin(w-Math.PI/2))*.7*Math.min(1,k*5);
    o.armD=-Math.sin(w)*.4*Math.min(1,k*5);o.torso=.05;o.y=.87+Math.abs(Math.sin(w))*.025;
  }
  return o;
}
function herPose(t){
  return {x:.7,y:.5+Math.sin(t*1.5+1)*.01,z:HZ0,yaw:0,torso:-Math.PI/2,thigh:-Math.PI/2,knee:0,eyes:.12,arm:0,smile:.4};
}

/* ---------- camera ---------- */

 [0.0,[17,12,13],[0,1.2,0],50],

function camAt(t){
  let i=0;while(i<KF.length-2&&t>KF[i+1][0])i++;
  const a=KF[i],b=KF[i+1],lp=clamp((t-a[0])/(b[0]-a[0])),u=(i+lerp(lp,sm(lp),.45))/(KF.length-1);
  cam.position.copy(pCur.getPoint(u));const tgt=lCur.getPoint(u);cam.fov=lerp(a[3],b[3],lp);cam.updateProjectionMatrix();
  const sh=Math.sin(t*1.3)*.012;cam.position.y+=sh;cam.lookAt(tgt);
}

/* ---------- captions ---------- */
const CAPS=[[1.2,4.4,'אתה קם בבוקר. כמו בכל יום.'],[13.0,15.0,'מצחצח שיניים. מסתכל במראה.']];
function render(t){
  // animate scene
  pose(him,himPose(t));pose(her,herPose(t));frontWall.visible=t<5.5;
  const e=sm(prog(t,9.0,10.0));blkHim.scale.z=lerp(1,.45,e);blkHim.position.z=lerp(.4,1.2,e);blkHim.position.y=lerp(.6,.52,e);
  // alarm
  const ring=t>=8.4&&t<10.2;clock.position.x=-2.35+(ring?Math.sin(t*90)*.006:0);clock.rotation.z=ring?Math.sin(t*70)*.05:0;
  rings.forEach((m,i)=>{const a=((t-8.4-i*.28)%.85+.85)%.85/.85;const on=t>=8.4&&t<10.0;m.material.opacity=on?.6*(1-a):0;m.scale.setScalar(.4+a*2.4);m.lookAt(cam.position);});
  // landing ripple
  const rp=prog(t,10.9,11.9);ripple.material.opacity=rp>0&&rp<1?.55*(1-rp):0;ripple.scale.set(1+rp*3.2,1+rp*3.2,1);
  // dust
  for(let i=0;i<NP;i++){const s=hash(i)*6.28,u=hash(i+50);dustPos[i*3]=3.1-u*6+Math.sin(t*.3+s)*.25;dustPos[i*3+1]=.4+hash(i+90)*1.8+Math.sin(t*.4+s*2)*.15;dustPos[i*3+2]=.9-(1-u)*1.4*(hash(i+20)-.2)+Math.cos(t*.25+s)*.2;}
  dust.geometry.attributes.position.needsUpdate=true;
  camAt(t);R.render(S,cam);
  // overlays
  let c='',ca=0;for(const [a,b,tx] of CAPS)if(t>=a&&t<=b){c=tx;ca=Math.min(prog(t,a,a+.3),1-prog(t,b-.3,b));}
  const cap=document.getElementById('cap');cap.textContent=c;cap.style.opacity=ca.toFixed(3);cap.style.transform=`translateY(${((1-ca)*12).toFixed(1)}px)`;
  const tv=Math.min(prog(t,.4,1.0),1-prog(t,3.0,3.8));
  const tag=document.getElementById('tag');tag.innerHTML='<div class="n">פרק 1</div><div class="t">הלולאה השקופה</div>';tag.style.opacity=tv.toFixed(3);
  document.getElementById('dip').style.opacity=Math.max(1-prog(t,0,.5),prog(t,DUR-.5,DUR)).toFixed(3);
}
window.DUR=DUR;window.render=render;
document.fonts.load('800 50px Heebo').then(()=>document.fonts.load('400 26px Heebo')).then(()=>{window.ready=true;});
</script>

function person({skin,shirt,pants,hair,long}){

  const nose=new THREE.Mesh(new THREE.SphereGeometry(.024,10,8),M(skin));nose.position.set(0,-.012,.15);head.add(nose);
  for(const s of [-1,1]){const ear=new THREE.Mesh(new THREE.SphereGeometry(.03,8,6),M(skin));ear.position.set(s*.148,-.005,0);ear.scale.set(.5,1,.8);head.add(ear);}
  const eyes=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.058,.022,.125);g.scale.setScalar(1.28);head.add(g);
    const w=new THREE.Mesh(new THREE.SphereGeometry(.031,14,10),M('#fbfbfb',.3));g.add(w);
    const pu=new THREE.Mesh(new THREE.SphereGeometry(.016,10,8),M('#1e2228',.3));pu.position.z=.022;g.add(pu);
    const lg=new THREE.Group();lg.position.set(0,.034,.006);g.add(lg);
    const lg2=new THREE.BoxGeometry(.078,.07,.014);lg2.translate(0,-.035,0);const lid=new THREE.Mesh(lg2,M(skin,.9));lg.add(lid);

    const hand=new THREE.Mesh(new THREE.SphereGeometry(.05,10,8),M(skin));hand.position.y=-.3;el.add(hand);return {sh,el};});
  const legs=[-1,1].map(s=>{const hp=new THREE.Group();hp.position.set(s*.09,0,0);root.add(hp);
    const th=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.24,6,10),M(pants));th.position.y=-.19;th.castShadow=true;hp.add(th);
    const kn=new THREE.Group();kn.position.y=-.38;hp.add(kn);
    const sn=new THREE.Mesh(new THREE.CapsuleGeometry(.065,.26,6,10),M(pants));sn.position.y=-.2;sn.castShadow=true;kn.add(sn);

function pose(p,o){
  p.yaw.rotation.y=o.yaw||0;p.yaw.position.set(o.x,o.y,o.z);
  p.torso.rotation.x=o.torso||0;p.chest.rotation.x=o.chest||0;p.neck.rotation.x=o.neck||0;
  p.head.rotation.x=o.headX||0;p.head.rotation.y=o.headY||0;p.head.rotation.z=o.headZ||0;
  p.eyes.forEach(e=>{e.lg.scale.y=clamp(o.lid??0,.001,1);e.pu.position.x=(o.gx||0)*.009;e.pu.position.y=(o.gy||0)*.009;

  for(let i=0;i<2;i++){p.legs[i].hp.rotation.x=(o.thigh??-Math.PI/2)+(i?(o.thighD||0):-(o.thighD||0));p.legs[i].kn.rotation.x=(o.knee||0)+(i?(o.kneeD||0):(o.kneeD2||0));

}

/* ---------- him over time ---------- */
const L1=.38, KNEE_Y=.49, KX=-1.62, HZ0=-.48;
function himPose(t){
  const o={x:-.7,y:.5,z:HZ0,yaw:0,torso:-Math.PI/2,chest:0,neck:0,headX:0,headY:0,headZ:0,thigh:-Math.PI/2,knee:0,lid:1,brow:0,tilt:0,mouth:-.05,open:0,glow:0,gx:0,gy:0,aL:[0,0,0],aR:[0,0,0]};

  // asleep + restless
  o.mouth=.05;o.open=.18*(0.5+.5*Math.sin(t*1.6));
  if(t>7.6)o.headZ=.12*Math.sin((t-7.6)*3)*prog(t,7.6,8.4);
  // alarm: groan, rubs face
  const al=sm(prog(t,8.4,8.8))*(1-sm(prog(t,9.2,9.6)));
  o.tilt=-.55*al;o.brow=-.6*al;o.mouth=lerp(o.mouth,-.7,al);o.open=lerp(o.open,.35,al);
  o.aL=[lerp(0,2.5,al),0,lerp(0,-2.0,al)];
  // sit up (slow, heavy)
  const sit=rob(prog(t,9.2,10.0),5);o.torso=lerp(-Math.PI/2,0,sit);
  o.chest=.5*sit;o.neck=.35*sit;o.lid=lerp(1,.62,prog(t,9.6,10.1));
  // yawn with hand to mouth
  const yw=sm(prog(t,10.4,10.9))*(1-sm(prog(t,11.3,11.7)));
  const gl=sm(prog(t,9.8,10.0))*(1-sm(prog(t,10.3,10.5)));o.headY=-.9*gl;o.tilt=lerp(o.tilt,-.8,gl);o.brow=lerp(o.brow,-.7,gl);o.mouth=lerp(o.mouth,-.8,gl);o.lid=lerp(o.lid,.45,gl);o.gx=-1.4*gl;
  o.open=lerp(o.open*(1-sit),.95,yw);o.mouth=lerp(o.mouth,-.1,yw);o.lid=lerp(o.lid,1,yw);o.brow=lerp(o.brow,.8,yw);
  o.aR=[lerp(0,-1.9,yw),0,lerp(0,-2.1,yw)];
  o.aL=[lerp(o.aL[0],.15,sit),lerp(o.aL[1],0,sit),lerp(o.aL[2],.1,sit)];
  // legs swing off the bed
  const sw=rob(prog(t,11.2,12.0),4);
  o.yaw=lerp(0,-Math.PI/2,sw);o.x=lerp(-.7,KX+L1,sw);
  o.knee=lerp(0,Math.PI/2,rob(prog(t,11.5,12.1),3));
  o.headX=.1*sw;o.gy=-.6*sw;
  // heavy sigh on landing
  const sg=Math.sin(Math.PI*prog(t,12.1,12.9));o.chest+=-.15*sg;o.neck+=-.15*sg;
  // stand
  const st=rob(prog(t,12.6,13.5),4),ph=(1-st)*Math.PI/2;
  if(t>=12.6){o.thigh=-ph;o.knee=ph;o.x=KX+L1*Math.sin(ph);o.y=KNEE_Y+L1*Math.cos(ph);o.torso=.2*Math.sin(Math.PI*st);}
  // half-hearted stretch + scratch
  const sr=sm(prog(t,13.5,13.9))*(1-sm(prog(t,14.1,14.4)));
  o.aL=[lerp(o.aL[0],-2.6,sr),lerp(o.aL[1],-.3,sr),lerp(o.aL[2],0,sr)];o.aR=[lerp(o.aR[0],.2,sr),0,.1];
  o.lid=lerp(o.lid,.9,sr);o.open=lerp(o.open,.4,sr);o.neck=lerp(o.neck,-.1,sr);
  o.chest=lerp(o.chest,.05,sr);
  // shuffle toward the bright doorway
  if(t>=14.3){
    const k=prog(t,14.3,15),w=(t-14.3)*7;
    o.x=lerp(KX,-2.35,sm(clamp(k)));o.thigh=0;o.thighD=Math.sin(w)*.4*Math.min(1,k*4);
    o.knee=0;o.kneeD=Math.max(0,Math.sin(w+Math.PI/2))*.6*Math.min(1,k*4);o.kneeD2=Math.max(0,Math.sin(w-Math.PI/2))*.6*Math.min(1,k*4);
    o.aL=[Math.sin(w)*.3,0,.1];o.aR=[-Math.sin(w)*.3,0,.1];o.torso=.04;o.chest=lerp(.45,.1,sm(prog(t,14.5,15)));o.neck=lerp(.25,-.05,sm(prog(t,14.5,15)));o.y=.87+Math.abs(Math.sin(w))*.02;
    o.lid=.6;o.open=0;o.mouth=-.1;o.gy=0;o.gx=-.4;
  }
  // flicker of hope: the spark in the chest
  const sp=sm(prog(t,12.6,14.8));o.glow=.9*sp*(.85+.15*Math.sin(t*5));
  if(t>=14.3){o.mouth=lerp(-.1,.9,sm(prog(t,14.5,15)));o.brow=.8*sm(prog(t,14.5,15));o.lid=lerp(.6,.25,sm(prog(t,14.5,15)));o.gy=.5*sm(prog(t,14.5,15));}
  return o;
}
function herPose(t){
  const o={x:.7,y:.5+Math.sin(t*1.5+1)*.01,z:HZ0,yaw:0,torso:-Math.PI/2,thigh:-Math.PI/2,knee:0,lid:1,mouth:.1,open:.1,brow:0,tilt:0,headZ:0,aL:[0,0,0],aR:[0,0,0]};
  const g=sm(prog(t,8.5,8.9))*(1-sm(prog(t,9.6,10.0)));o.tilt=-.4*g;o.headZ=.25*g;o.mouth=lerp(.1,-.4,g);
  return o;
}

/* ---------- camera ---------- */
const cam=new THREE.PerspectiveCamera(45,720/1280,.1,400);
const KF=[
 [0.0,[17,12,13],[0,1.2,0],50],
 [2.4,[10,6.4,7],[1.4,1.4,.5],48],
 [3.9,[6.4,2.2,1.0],[2.2,1.5,.9],46],
 [4.8,[3.3,1.7,.95],[.2,.95,.2],46],
 [5.7,[1.8,1.55,1.5],[-.1,.7,-.3],44],
 [6.6,[1.2,2.0,3.1],[-.1,.6,-.5],43],
 [7.4,[.4,2.5,3.9],[-.1,.55,-.6],42],
 [8.6,[-.5,1.8,1.6],[-.7,.62,-1.0],36],
 [9.9,[.1,1.4,2.2],[-.75,1.0,-.55],36],
 [11.4,[-.3,1.3,2.0],[-1.2,.85,-.5],40],
 [12.8,[-2.6,1.45,1.0],[-1.55,.95,-.5],44],
 [14.2,[-2.5,1.5,1.3],[-1.8,1.0,-.5],44],
 [15.0,[-1.8,1.5,2.0],[-2.4,1.0,-.5],46]];
const pCur=new THREE.CatmullRomCurve3(KF.map(k=>new THREE.Vector3(...k[1])),false,'centripetal');
const lCur=new THREE.CatmullRomCurve3(KF.map(k=>new THREE.Vector3(...k[2])),false,'centripetal');
function camAt(t){
  let i=0;while(i<KF.length-2&&t>KF[i+1][0])i++;
  const a=KF[i],b=KF[i+1],lp=clamp((t-a[0])/(b[0]-a[0])),u=(i+lerp(lp,sm(lp),.45))/(KF.length-1);
  cam.position.copy(pCur.getPoint(u));const tgt=lCur.getPoint(u);cam.fov=lerp(a[3],b[3],lp);cam.updateProjectionMatrix();
  const sh=Math.sin(t*1.3)*.012;cam.position.y+=sh;cam.lookAt(tgt);
}

/* ---------- captions ---------- */
const CAPS=[[1.2,4.4,'אתה קם בבוקר. כמו בכל יום.'],[13.0,15.0,'מצחצח שיניים. מסתכל במראה.']];
function render(t){
  // animate scene
  pose(him,himPose(t));pose(her,herPose(t));frontWall.visible=t<5.5;
  const e=sm(prog(t,9.0,10.0));blkHim.scale.z=lerp(1,.45,e);blkHim.position.z=lerp(.4,1.2,e);blkHim.position.y=lerp(.6,.52,e);
  // alarm
  const ring=t>=8.4&&t<10.3;clock.position.x=-2.35+(ring?Math.sin(t*90)*.006:0);clock.rotation.z=ring?Math.sin(t*70)*.05:0;
  rings.forEach((m,i)=>{const a=((t-8.4-i*.28)%.85+.85)%.85/.85;const on=t>=8.4&&t<10.2;m.material.opacity=on?.6*(1-a):0;m.scale.setScalar(.4+a*2.4);m.lookAt(cam.position);});
  // landing ripple
  const rp=prog(t,10.9,11.9);ripple.material.opacity=rp>0&&rp<1?.55*(1-rp):0;ripple.scale.set(1+rp*3.2,1+rp*3.2,1);
  // dust
  for(let i=0;i<NP;i++){const s=hash(i)*6.28,u=hash(i+50);dustPos[i*3]=3.1-u*6+Math.sin(t*.3+s)*.25;dustPos[i*3+1]=.4+hash(i+90)*1.8+Math.sin(t*.4+s*2)*.15;dustPos[i*3+2]=.9-(1-u)*1.4*(hash(i+20)-.2)+Math.cos(t*.25+s)*.2;}
  dust.geometry.attributes.position.needsUpdate=true;
  camAt(t);R.render(S,cam);
  // overlays
  let c='',ca=0;for(const [a,b,tx] of CAPS)if(t>=a&&t<=b){c=tx;ca=Math.min(prog(t,a,a+.3),1-prog(t,b-.3,b));}
  const cap=document.getElementById('cap');cap.textContent=c;cap.style.opacity=ca.toFixed(3);cap.style.transform=`translateY(${((1-ca)*12).toFixed(1)}px)`;
  const tv=Math.min(prog(t,.4,1.0),1-prog(t,3.0,3.8));
  const tag=document.getElementById('tag');tag.innerHTML='<div class="n">פרק 1</div><div class="t">הלולאה השקופה</div>';tag.style.opacity=tv.toFixed(3);
  document.getElementById('dip').style.opacity=Math.max(1-prog(t,0,.5),prog(t,DUR-.5,DUR)).toFixed(3);
}
window.DUR=DUR;window.render=render;
document.fonts.load('800 50px Heebo').then(()=>document.fonts.load('400 26px Heebo')).then(()=>{window.ready=true;});

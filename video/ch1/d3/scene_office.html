  const cap=new THREE.Mesh(new THREE.SphereGeometry(.158,24,14,0,Math.PI*2,0,1.5),M(hair));cap.scale.set(.97,1.1,1.02);cap.rotation.x=-.5;cap.castShadow=true;head.add(cap);

  const legs=[-1,1].map(s=>{const hp=new THREE.Group();hp.position.set(s*.08,0,0);root.add(hp);
    const th=new THREE.Mesh(new THREE.CapsuleGeometry(.07,.24,6,10),M(pants));th.position.y=-.19;th.castShadow=true;hp.add(th);

function pose(p,o){

// coworkers: [x, z, yaw, skin, top, hair]
const COW=[[-3.0,.2,-Math.PI/2,'#d9a47a','#59616d','#3a2a22'],[-3.0,-6.2,-Math.PI/2,'#f0c7a2','#6b5b73','#5a3a2a'],[-3.0,-9.4,-Math.PI/2,'#a8704c','#3d4a5c','#1f1a18'],
           [3.0,-6.2,Math.PI/2,'#efc09a','#55606b','#7a5a3a'],[3.0,-9.4,Math.PI/2,'#c58d66','#5d6573','#2b2320']].map((c,i)=>({
  p:person({skin:c[3],top:c[4],shirt:'#eeeeee',pants:'#2f3440',hair:c[5],headS:1.12,noseS:1}),x:c[0],z:c[1],yaw:c[2],i}));

const KX=-3.38,L1=.38,KNEE_Y=.49;
function heroPose(t){

function cowPose(c,t){

const ring=new THREE.Mesh(new THREE.RingGeometry(.96,1,64),new THREE.MeshBasicMaterial({color:'#ffd98a',transparent:true,opacity:0,side:THREE.DoubleSide,fog:false,blending:THREE.AdditiveBlending,depthWrite:false}));
ring.rotation.x=-Math.PI/2;ring.position.set(ORG.x,.03,ORG.z);S.add(ring);
const NS=220,sp=new Float32Array(NS*3),sparks=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({color:'#fff0b8',size:.09,map:glowTex(),transparent:true,opacity:.9,depthWrite:false,fog:false,blending:THREE.AdditiveBlending}));
sparks.geometry.setAttribute('position',new THREE.BufferAttribute(sp,3));sparks.frustumCulled=false;S.add(sparks);

/* ---- camera ---- */
const cam=new THREE.PerspectiveCamera(40,W/H,.1,200);
const KF=[
 [0.0,[1.4,1.75,12.0],[-1.2,1.25,-3.0],40],
 [2.4,[.6,1.7,3.4],[-2.5,1.15,-3.0],34],
 [3.6,[-.9,1.9,-.4],[-3.2,1.15,-3.0],30],
 [4.8,[-.7,1.8,-.6],[-3.3,1.2,-3.0],30],
 [6.0,[.2,1.4,-1.7],[-3.3,1.25,-3.0],28],
 [7.4,[-.3,1.4,-1.5],[-3.4,1.3,-3.0],26],
 [8.6,[.5,1.75,-.1],[-3.0,1.2,-3.2],40],
 [10.0,[1.6,2.4,2.4],[-2.6,1.2,-3.6],46]];
const pC=new THREE.CatmullRomCurve3(KF.map(k=>new THREE.Vector3(...k[1])),false,'centripetal'),lC=new THREE.CatmullRomCurve3(KF.map(k=>new THREE.Vector3(...k[2])),false,'centripetal');
function camAt(t){let i=0;while(i<KF.length-2&&t>KF[i+1][0])i++;const a=KF[i],b=KF[i+1],lp=clamp((t-a[0])/(b[0]-a[0])),u=(i+lerp(lp,sm(lp),.5))/(KF.length-1);
  cam.position.copy(pC.getPoint(u));cam.fov=lerp(a[3],b[3],lp);cam.updateProjectionMatrix();cam.position.y+=Math.sin(t*1.2)*.01;cam.lookAt(lC.getPoint(u));}

/* ---- frame ---- */
const WARM_L=new THREE.Color('#fff0c8'),COOL_L=new THREE.Color('#dfeaf5');
const CAPS=[[7.0,9.8,'כשתרגישו מוערכים — יעריכו אתכם.']];
function render(t){
  const Rw=Rwave(t),P=clamp(Rw/RMAX);
  for(const m of reg){const d=m.userData.p.distanceTo(ORG),c=1-sm(clamp((d-(Rw-3.5))/3.5));m.material.color.copy(m.userData.gray).lerp(m.userData.base,c);}
  ceilLights.forEach(m=>{const d=m.position.distanceTo(ORG),c=1-sm(clamp((d-(Rw-3.5))/3.5));m.material.color.copy(COOL_L).lerp(WARM_L,c);});
  {const d=4.95-ORG.x,c=clamp(Rw/9);win.material.color.copy(new THREE.Color('#dbe7f2')).lerp(new THREE.Color('#ffd98a'),sm(c));}
  hemi.color.copy(new THREE.Color('#cfd8e6')).lerp(new THREE.Color('#ffe9c4'),P);hemi.intensity=lerp(.95,1.25,P);
  sun.color.copy(new THREE.Color('#dbe7f5')).lerp(new THREE.Color('#ffc474'),P);sun.intensity=lerp(1.0,3.4,sm(P));
  S.background.copy(new THREE.Color('#7f8b97')).lerp(new THREE.Color('#e8b98a'),P);S.fog.color.copy(S.background);
  const ho=heroPose(t);heroLight.position.set(ORG.x+.6,1.3,ORG.z);heroLight.intensity=ho.glow*3.2;
  pose(hero,ho);COW.forEach(c=>pose(c.p,cowPose(c,t)));
  flowers.forEach((f,i)=>{const d=f.position.distanceTo(ORG),c=1-sm(clamp((d-(Rw-3))/3));f.scale.setScalar(.001+c*(.9+.25*Math.sin(t*4+i)));});
  const ro=Rw>.1?.55*(1-prog(t,8.6,9.8)):0;ring.scale.setScalar(Math.max(.01,Rw));ring.material.opacity=ro;
  for(let i=0;i<NS;i++){const a=hash(i)*6.283,h=hash(i+7)*2.3,jr=(hash(i+3)-.5)*1.4;const rr=Math.max(0,Rw+jr);sp[i*3]=ORG.x+Math.cos(a)*rr;sp[i*3+1]=.2+h+Math.sin(t*2+i)*.1;sp[i*3+2]=ORG.z+Math.sin(a)*rr;}
  sparks.material.opacity=Rw>.1?.9*(1-prog(t,8.8,9.9)):0;sparks.geometry.attributes.position.needsUpdate=true;
  camAt(t);R.render(S,cam);
  let c='',ca=0;for(const [a,b,tx] of CAPS)if(t>=a&&t<=b){c=tx;ca=Math.min(prog(t,a,a+.3),1-prog(t,b-.3,b));}
  const cp=document.getElementById('cap');cp.textContent=c;cp.style.opacity=ca.toFixed(3);cp.style.transform=`translateY(${((1-ca)*10).toFixed(1)}px)`;
  document.getElementById('dip').style.opacity=Math.max(1-prog(t,0,.5),prog(t,DUR-.5,DUR)).toFixed(3);
}
window.DUR=DUR;window.render=render;
document.fonts.load('800 48px Heebo').then(()=>{window.ready=true;});
</script>

<!doctype html><meta charset=utf-8><style>
@font-face{font-family:Heebo;font-weight:300;src:url(fonts/heebo-300.ttf)}
@font-face{font-family:Heebo;font-weight:500;src:url(fonts/heebo-500.ttf)}
@font-face{font-family:Heebo;font-weight:800;src:url(fonts/heebo-800.ttf)}
html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id=c></canvas><script>
const q=new URLSearchParams(location.search),W=+q.get('w')||1920,H=+q.get('h')||1080,BG=q.get('bg')==='1';
const c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const GOLD='#e9b35f',LIGHT='#ffe2a6',DEEP='#b8863a',CREAM='#faf8f4';
const k=Math.min(W/1080,H/1080)*(W>H?1.0:1.0),cx=W/2,cy=H*(W>H?.35:.34),a=195*k;
const N=360,pts=[];for(let i=0;i<=N;i++){const u=i/N*Math.PI*2,d=1+Math.sin(u)**2;pts.push([cx+a*1.9*Math.cos(u)/d,cy+a*1.9*Math.sin(u)*Math.cos(u)/d])}
function rnd(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const R=rnd(11),SP=Array.from({length:26},()=>({i:Math.floor(R()*N),ph:R()*6.28,sp:.8+R()*1.4,r:2+R()*3.2,off:(R()-.5)*60*k}));
function T(str,x,y,o){g.save();g.globalAlpha=o.a??1;g.font=`${o.w||500} ${o.s}px Heebo`;g.fillStyle=o.c||CREAM;g.textAlign='center';g.textBaseline='middle';g.direction='rtl';if(o.gl){g.shadowColor=o.gl;g.shadowBlur=o.gb||24}g.fillText(str,x,y);g.restore()}
function frame(t){g.clearRect(0,0,W,H);
 if(BG){const b=g.createRadialGradient(cx,H*.45,50,cx,H*.45,Math.max(W,H)*.75);b.addColorStop(0,'#2a1d0e');b.addColorStop(.55,'#120d07');b.addColorStop(1,'#050403');g.fillStyle=b;g.fillRect(0,0,W,H)}
 const draw=eio(P(t,.2,2.1)),n=Math.floor(draw*N),pulse=.5+.5*Math.sin(Math.max(0,t-2.2)*2.2);
 const lg=g.createLinearGradient(cx-a*1.9,0,cx+a*1.9,0);lg.addColorStop(0,DEEP);lg.addColorStop(.5,GOLD);lg.addColorStop(1,LIGHT);
 // soft halo once drawn
 const halo=eo(P(t,1.8,2.8));if(halo>0){g.save();g.globalAlpha=halo*(.18+.1*pulse);const hg=g.createRadialGradient(cx,cy,10,cx,cy,a*3);hg.addColorStop(0,'rgba(233,179,95,.9)');hg.addColorStop(1,'rgba(233,179,95,0)');g.fillStyle=hg;g.fillRect(0,0,W,H);g.restore()}
 g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=lg;g.lineWidth=(10+3*halo*pulse)*k;g.shadowColor='rgba(233,179,95,.85)';g.shadowBlur=(18+14*halo)*k;g.beginPath();for(let i=0;i<=n;i++){const p=pts[i];i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke();
 if(draw<1&&n>2){const p=pts[n];g.shadowBlur=40*k;g.fillStyle=LIGHT;g.beginPath();g.arc(p[0],p[1],10*k,0,7);g.fill()}
 // flowing comet after the draw
 if(t>2.3){const hd=Math.floor(((t-2.3)*.38%1)*N),L=90;for(let j=0;j<L;j++){const p1=pts[(hd-j+N)%N],p2=pts[(hd-j-1+N)%N],f=1-j/L;g.strokeStyle=`rgba(255,238,200,${f})`;g.lineWidth=(14*f+4)*k;g.shadowBlur=30*k;g.beginPath();g.moveTo(p1[0],p1[1]);g.lineTo(p2[0],p2[1]);g.stroke()}}
 g.restore();
 // sparkles
 if(t>1.2)SP.forEach(s=>{const tw=Math.max(0,Math.sin(t*s.sp+s.ph)),p=pts[s.i],al=tw*tw*eo(P(t,1.2,2.4))*.9;if(al<.02)return;g.save();g.globalAlpha=al;g.fillStyle=LIGHT;g.shadowColor=GOLD;g.shadowBlur=14*k;const x=p[0],y=p[1]+s.off*.4,r=s.r*k;g.beginPath();g.moveTo(x,y-r*2.6);g.lineTo(x+r*.6,y-r*.6);g.lineTo(x+r*2.6,y);g.lineTo(x+r*.6,y+r*.6);g.lineTo(x,y+r*2.6);g.lineTo(x-r*.6,y+r*.6);g.lineTo(x-r*2.6,y);g.lineTo(x-r*.6,y-r*.6);g.closePath();g.fill();g.restore()});
 // wordmark
 const ty=H*(W>H?.68:.66),e1=eo(P(t,1.5,2.5));T('בית למסע',cx,ty+22*k*(1-e1),{s:200*k,w:800,c:GOLD,a:e1,gl:'rgba(233,179,95,.35)',gb:30*k});
 const ln=eo(P(t,2.1,2.8));g.save();g.globalAlpha=ln;g.fillStyle=GOLD;const lw=300*k*ln;g.fillRect(cx-lw/2,ty+135*k,lw,3*k);g.restore();
 const e2=eo(P(t,2.3,3.1));T('מרכז להתפתחות ואימון',cx,ty+215*k+14*k*(1-e2),{s:62*k,w:300,c:CREAM,a:e2});
}
</script>

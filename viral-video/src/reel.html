<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const seg=(lt,d,dur)=>ease((lt-d)/dur);
const NS='http://www.w3.org/2000/svg';
const TOTAL=40;
const SEG=[[0,4.4,'s1'],[4.4,10.2,'s2'],[10.2,15.0,'s3'],[15.0,20.4,'s4'],[20.4,27.0,'s5'],[27.0,32.6,'s6'],[32.6,TOTAL,'s7']];
// stars
function stars(id,n){$(id).innerHTML=Array.from({length:n},(_,i)=>`<circle cx="${(i*131)%720}" cy="${(i*97)%700+20}" r="${1+(i%3)}" fill="#fff" class="st" opacity=".6"/>`).join('')}

$('rays3').innerHTML=Array.from({length:12},(_,i)=>`<rect x="-6" y="-120" width="12" height="40" rx="6" fill="#ffd54a" transform="rotate(${i*30})"/>`).join('');
$('rays6').innerHTML=Array.from({length:12},(_,i)=>`<rect x="-6" y="-112" width="12" height="38" rx="6" fill="#fff3b0" transform="rotate(${i*30})"/>`).join('');
$('waves3').innerHTML=[0,1,2].map(r=>`<g class="wv"><path d="M-40 ${790+r*50} q30 -22 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/></g>`).join('');
$('w2').innerHTML=Array.from({length:22},(_,i)=>`<rect x="${-110+i*10}" y="-4" width="6" height="8" rx="3" fill="#7fe9ff" class="wb"/>`).join('');
// money cards
const CARDS=[['שיחות שנענו',24,'#3de1ff',0],['פגישות שנקבעו',9,'#e0b877',1],['מכירות','₪',  '#27d17a',2]];
$('cards5').innerHTML=CARDS.map((c,i)=>`<g id="c5${i}" transform="translate(0 ${360+i*150})"><rect x="60" y="0" width="600" height="120" rx="22" fill="#10224f" stroke="${c[2]}" stroke-width="3"/><text x="360" y="44" text-anchor="middle" font-size="28" font-weight="500" fill="#bcd0ff">${c[0]}</text><text id="c5n${i}" class="o" x="360" y="98" text-anchor="middle" font-size="54" fill="${c[2]}" style="direction:ltr">0</text></g>`).join('');
$('bars5').innerHTML=Array.from({length:10},(_,i)=>`<rect id="b5${i}" x="${90+i*55}" y="1100" width="40" height="0" rx="8" fill="#27d17a"/>`).join('');
$('coins5').innerHTML=Array.from({length:18},(_,i)=>`<g id="co${i}"><circle r="22" fill="#ffd54a" stroke="#c8941a" stroke-width="4"/><text y="8" text-anchor="middle" font-size="22" font-weight="800" fill="#8a5d00">₪</text></g>`).join('');
function render(t){
  SEG.forEach(([a,b,id],i)=>{let o=Math.min(clamp((t-a)/.25),clamp((b-t)/.25));if(i===0)o=Math.min(clamp((b-t)/.25),1);if(i===SEG.length-1)o=Math.min(clamp((t-a)/.3),clamp((TOTAL-t)/.8));$(id).style.opacity=o});
  $('logo').style.opacity=t<32.6?1:0;
  document.querySelectorAll('.st').forEach((s,i)=>s.setAttribute('opacity',.35+.35*Math.sin(t*2+i)));
  const L=i=>clamp(t-SEG[i][0],0,SEG[i][1]-SEG[i][0]);let lt;
  // s1
  lt=L(0);[1,2,3].forEach(k=>{const p=((lt*.6+k*.33)%1);$('z'+k).setAttribute('opacity',Math.sin(p*Math.PI));$('z'+k).setAttribute('transform',`translate(0 ${-p*40})`)});
  [1,2,3].forEach(k=>{const p=((lt*1.1+k*.33)%1);const c=$('r'+k);c.setAttribute('r',40+p*150);c.setAttribute('opacity',(1-p)*.8)});
